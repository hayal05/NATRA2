name: Accounting Sales Integration

on:
  push:
    branches:
      - 'accounting/core-double-entry'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply sales accounting integration
        run: python3 scripts/integrate_accounting_sales.py

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check --locked

      - name: Commit integration and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/accounting.rs
          git rm .github/workflows/_accounting_sales_integrate.yml scripts/integrate_accounting_sales.py
          git commit -m "feat: post sales to double-entry ledger"
          git push origin HEAD:accounting/core-double-entry
