name: Accounting Sales Integration

on:
  push:
    branches:
      - accounting/core-double-entry

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sales accounting integration
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          if "mod accounting;" not in text:
              text = "mod accounting;\n" + text

          schema_needle = "            init_schema(&c).await?;\n"
          schema_replacement = schema_needle + "            accounting::ensure_schema(&c).await?;\n"
          if "accounting::ensure_schema(&c).await?;" not in text:
              if schema_needle not in text:
                  raise SystemExit("init_schema insertion point not found")
              text = text.replace(schema_needle, schema_replacement, 1)

          start = text.index("async fn record_sale")
          end = text.index("\n#[derive(Debug, Deserialize)]\nstruct ReturnInput", start)
          block = text[start:end]

          commit_needle = "    tx.commit().await.map_err(|e| e.to_string())?;\n    Ok(reference)\n"
          journal_code = r'''    let receivable = subtotal - paid_amount;
    let mut journal_lines: Vec<(&str, f64, f64, &str)> = Vec::with_capacity(5);
    if paid_amount > 0.005 {
        let cash_account = if payment_method == "Credit" {
            input.payment_account.as_deref().unwrap_or("Cash").trim()
        } else {
            payment_method
        };
        let account_code = match cash_account {
            "Cash" => "1000",
            "Bank" => "1010",
            "Mobile Money" => "1020",
            _ => return Err("Invalid payment account".into()),
        };
        journal_lines.push((account_code, paid_amount, 0.0, "Sale proceeds received"));
    }
    if receivable > 0.005 {
        journal_lines.push(("1100", receivable, 0.0, "Customer receivable"));
    }
    journal_lines.push(("4000", 0.0, subtotal, "Sales revenue"));
    if cogs > 0.005 {
        journal_lines.push(("5000", cogs, 0.0, "Cost of goods sold"));
        journal_lines.push(("1200", 0.0, cogs, "Inventory carrying amount released"));
    }
    accounting::post_in_transaction(
        &tx,
        &reference,
        &now,
        "Sale accounting entry",
        "SALE",
        Some(&reference),
        &journal_lines,
    ).await?;

    tx.commit().await.map_err(|e| e.to_string())?;
    Ok(reference)
'''
          if "accounting::post_in_transaction(" not in block:
              if commit_needle not in block:
                  raise SystemExit("record_sale commit insertion point not found")
              block = block.replace(commit_needle, journal_code, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding="utf-8")

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check --locked

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git rm .github/workflows/_accounting_sales_integrate.yml
          git commit -m "feat: post sales to double-entry ledger"
          git push origin HEAD:accounting/core-double-entry
