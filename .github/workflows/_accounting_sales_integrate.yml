name: Accounting Sales Integration

on:
  push:
    branches:
      - 'accounting/core-double-entry'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sales accounting integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          if "mod accounting;" not in text:
              text = "mod accounting;\n" + text

          schema_needle = "            init_schema(&c).await?;\n"
          if "accounting::ensure_schema(&c).await?;" not in text:
              if schema_needle not in text:
                  raise SystemExit("init_schema insertion point not found")
              text = text.replace(schema_needle, schema_needle + "            accounting::ensure_schema(&c).await?;\n", 1)

          start = text.index("async fn record_sale")
          end = text.index("\n#[derive(Debug, Deserialize)]\nstruct ReturnInput", start)
          block = text[start:end]

          commit_needle = "    tx.commit().await.map_err(|e| e.to_string())?;\n    Ok(reference)\n"
          if "accounting::post_in_transaction(" not in block:
              if commit_needle not in block:
                  raise SystemExit("record_sale commit insertion point not found")
              journal_code = '''    let receivable = subtotal - paid_amount;\n    let mut journal_lines: Vec<(&str, f64, f64, &str)> = Vec::with_capacity(5);\n    if paid_amount > 0.005 {\n        let cash_account = if payment_method == "Credit" {\n            input.payment_account.as_deref().unwrap_or("Cash").trim()\n        } else {\n            payment_method\n        };\n        let account_code = match cash_account {\n            "Cash" => "1000",\n            "Bank" => "1010",\n            "Mobile Money" => "1020",\n            _ => return Err("Invalid payment account".into()),\n        };\n        journal_lines.push((account_code, paid_amount, 0.0, "Sale proceeds received"));\n    }\n    if receivable > 0.005 {\n        journal_lines.push(("1100", receivable, 0.0, "Customer receivable"));\n    }\n    journal_lines.push(("4000", 0.0, subtotal, "Sales revenue"));\n    if cogs > 0.005 {\n        journal_lines.push(("5000", cogs, 0.0, "Cost of goods sold"));\n        journal_lines.push(("1200", 0.0, cogs, "Inventory carrying amount released"));\n    }\n    accounting::post_in_transaction(\n        &tx,\n        &reference,\n        &now,\n        "Sale accounting entry",\n        "SALE",\n        Some(&reference),\n        &journal_lines,\n    ).await?;\n\n    tx.commit().await.map_err(|e| e.to_string())?;\n    Ok(reference)\n'''
              block = block.replace(commit_needle, journal_code, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check --locked

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git rm .github/workflows/_accounting_sales_integrate.yml
          git commit -m "feat: post sales to double-entry ledger"
          git push origin HEAD:accounting/core-double-entry
