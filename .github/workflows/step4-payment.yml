name: Step 4 - Customer Payment Accounting

on:
  push:
    branches:
      - 'accounting/core-double-entry'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply customer payment accounting integration
        run: python scripts/integrate_accounting_payment.py

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo check

      - name: Commit integration and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs
          git rm .github/workflows/step4-payment.yml scripts/integrate_accounting_payment.py
          git commit -m "feat: post customer payments to double-entry ledger"
          git push origin HEAD:accounting/core-double-entry
