name: Trigger clean Windows build

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger Windows build
        shell: bash
        run: gh workflow run .github/workflows/main.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Remove one-time trigger
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/trigger-clean-build.yml
          git add .github/workflows/trigger-clean-build.yml
          git commit -m 'chore: remove one-time build trigger [skip ci]'
          git push
