name: One-time backend cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, 'retired backend cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired backend actions
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text(encoding='utf-8-sig')

          patterns = [
              r'\n#\[derive\(Debug, Deserialize\)\]\nstruct StockAdjustmentInput\s*\{.*?\n\}\n',
              r'\n#\[derive\(Debug, Deserialize\)\]\nstruct TransferInput\s*\{.*?\n\}\n',
              r'\n#\[derive\(Debug, Deserialize\)\]\s*struct ReturnInput\s*\{.*?\n\}\n',
              r'\n#\[tauri::command\]\s*async fn record_stock_adjustment\b.*?(?=\n#\[tauri::command\])',
              r'\n#\[tauri::command\]\s*async fn record_transfer\b.*?(?=\n#\[tauri::command\])',
              r'\n#\[tauri::command\]\s*async fn record_return\b.*?(?=\n#\[tauri::command\])',
              r'\n#\[tauri::command\]\s*async fn record_sale_legacy\b.*?(?=\n#\[tauri::command\]|\n#\[derive\(Debug, Serialize\)\])',
              r'\n\s*CREATE TABLE IF NOT EXISTS returns\s*\(.*?\);',
          ]

          for pattern in patterns:
              text, count = re.subn(pattern, '\n', text, flags=re.DOTALL)
              if count:
                  print(f'removed {count}: {pattern}')

          # Retired commands must never be exposed through Tauri's invoke surface.
          for name in ('record_stock_adjustment', 'record_transfer', 'record_return', 'record_sale_legacy'):
              text = re.sub(r',\s*' + re.escape(name) + r'(?=\s*[,\]])', '', text)

          # Clean accidental double blank lines left by block removal.
          text = re.sub(r'\n{3,}', '\n\n', text)
          path.write_text(text, encoding='utf-8')

          remaining = [name for name in ('StockAdjustmentInput', 'TransferInput', 'ReturnInput', 'record_stock_adjustment', 'record_transfer', 'record_return', 'record_sale_legacy') if name in text]
          if remaining:
              raise SystemExit('Retired symbols still present: ' + ', '.join(remaining))

      - name: Verify retired actions are gone
        shell: bash
        run: |
          ! grep -R -n -E 'record_stock_adjustment|record_transfer|record_return|record_sale_legacy|struct StockAdjustmentInput|struct TransferInput|struct ReturnInput' src-tauri/src/lib.rs

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-obsolete-actions.yml
          git add src-tauri/src/lib.rs .github/workflows/cleanup-obsolete-actions.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: retired backend cleanup [retired backend cleanup]'
          git push

      - name: Trigger Windows build
        if: ${{ success() }}
        shell: bash
        run: gh workflow run .github/workflows/build-windows.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
